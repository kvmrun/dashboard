{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}} · kvmrun dashboard</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<header>
    <div class="header-top">
        <a class="brand" href="/">kvmrun dashboard</a>
        <div class="versions">
            <span class="chip">kvmrun v{{.KvmrunVersion}}</span>
            <span class="chip">dash v{{.DashboardVersion}}</span>
        </div>
        {{if .User}}
        <span class="user">{{.User}}</span>
        <form method="post" action="/logout" class="inline"><button type="submit">Log out</button></form>
        {{end}}
    </div>
    <nav class="header-nav">
        <a href="/machines"{{if eq .Page "machines"}} class="active"{{end}}>Machines</a>
        <span class="divider" aria-hidden="true"></span>
        <a href="/tasks"{{if eq .Page "tasks"}} class="active"{{end}}>Tasks</a>
        <span class="divider" aria-hidden="true"></span>
        <a href="/top"{{if eq .Page "top"}} class="active"{{end}}>Top</a>
    </nav>
</header>
<main>
{{block "content" .}}{{end}}
</main>
<script src="/static/js/app.js"></script>
</body>
</html>
{{end}}
