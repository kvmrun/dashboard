{{template "layout" .}}

{{define "content"}}
<div class="vm-master">
    <aside class="vm-list">
        <div class="vm-list-head">
            <span class="vm-list-title">Machines</span>
            <span class="vm-count" id="vm-count"></span>
        </div>
        <div class="vm-search">
            <input type="search" id="vm-search" placeholder="Search VMs…" autocomplete="off">
        </div>
        <ul class="vm-items" id="vm-items"></ul>
    </aside>
    <section class="vm-detail" id="vm-detail" data-selected="{{.Selected}}">
        {{if .Error}}
        <p class="error">{{.Error}}</p>
        {{end}}
        {{if not .Selected}}
        <p class="vm-detail-empty hint">Select a machine</p>
        {{end}}
    </section>
</div>

<!-- Icon set for the machine detail pane (inline, stroke-based, currentColor). -->
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
        <symbol id="ic-power" viewBox="0 0 24 24">
            <path d="M12 3v8" />
            <path d="M7.2 6.2a7.5 7.5 0 1 0 9.6 0" />
        </symbol>
        <symbol id="ic-mem" viewBox="0 0 24 24">
            <rect x="3" y="7" width="18" height="9" rx="1.5" />
            <path d="M7 16v3M12 16v3M17 16v3" />
            <path d="M7 10v3M12 10v3M17 10v3" />
        </symbol>
        <symbol id="ic-cpu" viewBox="0 0 24 24">
            <rect x="5" y="5" width="14" height="14" rx="2" />
            <rect x="9.5" y="9.5" width="5" height="5" />
            <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3" />
        </symbol>
        <symbol id="ic-clock" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5" />
            <path d="M12 7v5l3.5 2" />
        </symbol>
        <symbol id="ic-net" viewBox="0 0 24 24">
            <circle cx="12" cy="5" r="2.5" />
            <circle cx="5" cy="18" r="2.5" />
            <circle cx="19" cy="18" r="2.5" />
            <path d="M11 7.2 6.2 15.8M13 7.2l4.8 8.6M7.5 18h9" />
        </symbol>
        <symbol id="ic-box" viewBox="0 0 24 24">
            <rect x="4" y="4" width="16" height="16" rx="2" />
            <path d="M4 10h16" />
        </symbol>
        <symbol id="ic-monitor" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="12" rx="1.5" />
            <path d="M9 20h6M12 16v4" />
        </symbol>
        <symbol id="ic-disk" viewBox="0 0 24 24">
            <ellipse cx="12" cy="6" rx="8" ry="3" />
            <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6" />
        </symbol>
        <symbol id="ic-comment" viewBox="0 0 24 24">
            <path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-5 4V6z" />
        </symbol>
        <symbol id="ic-terminal" viewBox="0 0 24 24">
            <path d="M4 5l6 6-6 6" />
            <path d="M12 19h8" />
        </symbol>
        <symbol id="ic-bridge" viewBox="0 0 24 24">
            <circle cx="5" cy="16" r="2" />
            <circle cx="19" cy="16" r="2" />
            <path d="M7 16h10" />
            <path d="M12 16V9" />
            <path d="M8 9h8" />
        </symbol>
        <symbol id="ic-routed" viewBox="0 0 24 24">
            <circle cx="5" cy="6" r="2.5" />
            <circle cx="19" cy="18" r="2.5" />
            <path d="M7.4 7.6C11 11 13 13 16.6 16.4" />
        </symbol>
        <symbol id="ic-vxlan" viewBox="0 0 24 24">
            <path d="M5 9a7 6 0 0 0 14 0" />
            <path d="M5 15a7 6 0 0 1 14 0" />
            <path d="M5 9v6" />
            <path d="M19 9v6" />
        </symbol>
        <symbol id="ic-vlan" viewBox="0 0 24 24">
            <path d="M3 11V4h7l10 10-7 7L3 11z" />
            <circle cx="7.5" cy="7.5" r="1.2" />
        </symbol>
    </defs>
</svg>
{{end}}
